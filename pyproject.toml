[project]
name = "api"
version = "0.1.0"
description = "AIKON-api"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "addict>=2.4.0",
    "cython>=3.2.4",
    "django-environ>=0.12.1",
    "dramatiq-abort[redis]>=1.2.1",
    "dramatiq[redis]>=2.0.1",
    "flask>=3.1.2",
    "fvcore>=0.1.5.post20221221",
    "httpx>=0.28.1",
    "huggingface-hub>=1.4.1",
    "hydra-core>=1.3.2",
    "iiif-download>=0.1.10",
    "kornia==0.7.*",
    "matplotlib>=3.10.8",
    "numpy>=1.26.4", 
    "opencv-python>=4.11.0.86",
    "orjson>=3.11.7",
    # "packaging>=26.0",
    "packaging",
    "pandas>=2.3.3",
    "panopticapi",
    "pillow>=10.0.0",
    "pycocotools>=2.0.11",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy<1.13",
    "seaborn>=0.13.2",
    "stream-unzip>=0.0.99",
    "stream-zip>=0.0.84",
    "svg-path>=7.0",
    "svgwrite>=1.4.3",
    "termcolor>=3.3.0",
    "timm>=1.0.24",
    "torch>=2.2",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "tox>=4.36.0",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.14",
    "yapf==0.3.1",
]

# [tool.uv.sources]
# panopticapi = { git = "https://github.com/cocodataset/panopticapi.git" }
# # if the app is dockerized, install torch-related libraries 
# # from `pytorch-dockerized` index, otherwise use the `pytorch-host` index.
# torch = [
#     { index = "pytorch-dockerized", marker = "env.DOCKER == 'True'" },
#     { index = "pytorch-host", marker = "env.DOCKER == 'False'" },
# ]
# torchvision = [
#     { index = "pytorch-dockerized", marker = "env.DOCKER == 'True'" },
#     { index = "pytorch-host", marker = "env.DOCKER == 'False'" },
# ]
# torchaudio = [
#     { index = "pytorch-dockerized", marker = "env.DOCKER == 'True'" },
#     { index = "pytorch-host", marker = "env.DOCKER == 'False'" },
# ]
# 
# # dockerized torch is installed with CUDA 12.6 builds, corresponding to the 
# # CUDA image used to build the docker (see `docker/Dockerfile`)
# # => dockerized AIKON-api is completely independent from the host's CUDA
# [[tool.uv.index]]
# name = "pytorch-dockerized"
# url = "https://download.pytorch.org/whl/cu126"
# priority = "explicit"
# 
# # non-dockerized torch will whatever CUDA the host has, if any. CUDA issues may arise
# [[tool.uv.index]]
# name = "pytorch-host"
# url = "https://download.pytorch.org/whl"
# priority = "explicit"

[tool.uv.sources]
panopticapi = { git = "https://github.com/cocodataset/panopticapi.git" }
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

# see this if you have torch issues:
# https://github.com/Aikon-platform/aikon-api/wiki/Torch-and-CUDA-Troubleshooting
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "dramatiq[redis,watch]>=2.0.1",
    "pre-commit>=4.5.1",
]
prod = [
    "gunicorn>=25.1.0",
]
